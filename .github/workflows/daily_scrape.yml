name: Daily NEPSE Floorsheet Scraper

on:
  schedule:
    # Runs Monday to Friday (1-5), the official NEPSE trading days
    # Primary: 09:51 UTC corresponds to 15:36 NPT (10 min after 15:00 market close settlement)
    - cron: '51 9 * * 1-5'
    # Fallback 1: 12:51 UTC corresponds to 18:36 NPT (+3h catch-up if GitHub scheduler delayed)
    - cron: '51 12 * * 1-5'
    # Fallback 2: 15:51 UTC corresponds to 21:36 NPT (+6h late catch-up before midnight)
    - cron: '51 15 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Execute Daily Scraper
        id: scraper
        run: |
          python scrape_daily.py

      - name: 🧾 Build Broker Summary
        run: |
          SCRAPED_DATE="${{ steps.scraper.outputs.scraped_date }}"
          if [ -n "${SCRAPED_DATE}" ] && [ -f "Floorsheet/${SCRAPED_DATE}.csv" ]; then
            echo "📊 Generating broker summary for ${SCRAPED_DATE}..."
            python DailySummary.py --date "${SCRAPED_DATE}"
          else
            echo "ℹ️ No newly scraped floorsheet in this run; checking if today's summary is pending..."
            TODAY=$(TZ="Asia/Kathmandu" date +'%Y-%m-%d')
            if [ -f "Floorsheet/${TODAY}.csv" ] && [ ! -f "Summary/${TODAY}_brokers.csv" ]; then
              python DailySummary.py --date "${TODAY}"
            else
              echo "ℹ️ Skipping broker summary: floorsheet not present or summary already built."
            fi
          fi

      - name: 🚀 Commit and Push Floorsheet + Summary
        run: |
          git config --local user.email "foreverzaraa@gmail.com"
          git config --local user.name "Your Zara"

          # Single atomic commit per day: floorsheet + its broker summaries together,
          # so one push failure can never leave a day in a partial state.
          git add Floorsheet/ Summary/

          if git diff --staged --quiet; then
            echo "ℹ️ No new data to commit for today."
          else
            TARGET_DATE="${{ steps.scraper.outputs.scraped_date }}"
            if [ -z "${TARGET_DATE}" ]; then
              TARGET_DATE=$(TZ="Asia/Kathmandu" date +'%Y-%m-%d')
            fi
            git commit -m "📊 NEPSE Floorsheet + Broker Summary: ${TARGET_DATE} 🚀 [skip ci]"
            git push
            echo "✅ Successfully committed and pushed floorsheet & summary for ${TARGET_DATE}!"
          fi
