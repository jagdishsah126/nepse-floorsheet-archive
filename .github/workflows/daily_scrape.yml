name: Daily NEPSE Floorsheet Scraper

on:
  schedule:
    # 09:51 UTC corresponds to 15:36 NPT (Nepal Time = UTC + 5:45)
    # Runs monday to friday (1-5), the official NEPSE trading days
    - cron: '51 9 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Execute Daily Scraper
        run: |
          python scrape_daily.py

      - name: 🧾 Build Broker Summary
        run: |
          TODAY=$(TZ="Asia/Kathmandu" date +'%Y-%m-%d')
          if [ -f "Floorsheet/${TODAY}.csv" ]; then
            python DailySummary.py --date "${TODAY}"
          else
            echo "ℹ️ No floorsheet for ${TODAY}; skipping broker summary."
          fi

      - name: 🚀 Commit and Push Floorsheet + Summary
        run: |
          git config --local user.email "foreverzaraa@gmail.com"
          git config --local user.name "Your Zara"

          # Single atomic commit per day: floorsheet + its broker summaries together,
          # so one push failure can never leave a day in a partial state.
          git add Floorsheet/ Summary/

          if git diff --staged --quiet; then
            echo "ℹ️ No new data to commit for today."
          else
            TODAY=$(TZ="Asia/Kathmandu" date +'%Y-%m-%d')
            git commit -m "📊 NEPSE Floorsheet + Broker Summary: ${TODAY} 🚀 [skip ci]"
            git push
            echo "✅ Successfully committed and pushed today's floorsheet & summary!"
          fi

