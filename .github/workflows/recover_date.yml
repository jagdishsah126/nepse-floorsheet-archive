name: Recover Historical Floorsheet

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to recover (YYYY-MM-DD)"
        required: true
        default: "2026-11-02"

permissions:
  contents: write

concurrency:
  group: recover-floorsheet
  cancel-in-progress: false

jobs:
  recover-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛠️ Execute Floorsheet Recovery
        run: |
          python recover_floorsheet.py --date "${{ inputs.date }}"

      - name: 🚀 Commit and Push Recovered Floorsheet + Summary
        run: |
          git config --local user.email "foreverzaraa@gmail.com"
          git config --local user.name "Your Zara"

          git add Floorsheet/ Summary/

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit."
          else
            TARGET_DATE="${{ inputs.date }}"
            git commit -m "🛠️ Recovered Floorsheet + Summary: ${TARGET_DATE} 🚀 [skip ci]"
            git push
            echo "✅ Successfully committed and pushed recovered data for ${TARGET_DATE}!"
          fi
